[package]
name = "splatter-sc"
version = "0.1.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GregorLueg/splatter-sc"
description = "A streaming Rust port of the Splat single-cell RNA-seq simulator from splatter."
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[features]
## Compile the bundled HDF5 C library from source instead of linking an
## external libhdf5 found via `HDF5_DIR` or pkg-config.
hdf5-static = ["hdf5/static"]
## Run the R parity tests on the large fixtures as well.
large-scale-tests = []

[dependencies]
flate2 = "1.1"
hdf5 = { package = "hdf5-metno", version = "0.15.0", features = ["zlib"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"

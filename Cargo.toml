[package]
name = "splatter-sc"
version = "0.1.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GregorLueg/splatter-sc"
description = "A streaming Rust port of the Splat single-cell RNA-seq simulator from splatter."

[dependencies]
flate2 = "1.1"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
